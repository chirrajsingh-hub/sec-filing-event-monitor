name: Weekly SEC monitor data refresh

on:
  schedule:
    # 13:00 UTC every Monday -- after the prior week's filings have settled.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate site/data.js from live EDGAR data
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/generate_site_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "secmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.js
          if git diff --cached --quiet; then
            echo "No changes this run."
            exit 0
          fi
          git commit -m "Weekly SEC filing data refresh"
          # Rebase onto whatever is currently on the branch before pushing --
          # protects against a re-run (or a second run overlapping this one)
          # starting from a base commit the branch has since moved past.
          git fetch origin main
          git rebase origin/main
          git push
