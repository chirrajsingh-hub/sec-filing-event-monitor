name: Weekly SEC monitor data refresh

on:
  schedule:
    # 13:00 UTC every Monday -- after the prior week's filings have settled.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate site/data.js from live EDGAR data
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/generate_site_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "secmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.js
          git diff --cached --quiet && echo "No changes this run." || git commit -m "Weekly SEC filing data refresh"
          git push
