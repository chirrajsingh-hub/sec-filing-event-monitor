[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secmonitor"
version = "0.1.0"
description = "Event-driven SEC 8-K monitor: EDGAR filings classified, scored, and turned into a weekly analyst memo"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["secmonitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
