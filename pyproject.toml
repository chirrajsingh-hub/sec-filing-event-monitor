[project]
name = "sec-filing-event-monitor"
version = "0.1.0"
description = "Event-driven SEC 8-K monitor that turns EDGAR filings into a weekly analyst-style memo"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
secmonitor = "secmonitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["secmonitor"]
